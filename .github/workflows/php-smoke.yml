name: PHP App Smoke Test
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: netvera_insaat
          MYSQL_USER: netvera
          MYSQL_PASSWORD: netvera
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_URL: http://127.0.0.1:8080
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: netvera_insaat
      DB_USERNAME: netvera
      DB_PASSWORD: netvera
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Import database
        run: mysql -h127.0.0.1 -unetvera -pnetvera netvera_insaat < database.sql
      - name: Database and admin smoke test
        run: php tests/smoke.php
      - name: Static preview link check
        run: php tests/static-links.php
      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/netvera-php.log 2>&1 &
          echo $! > /tmp/netvera-php.pid
          sleep 2
      - name: Test dynamic pages
        run: |
          curl -fsS http://127.0.0.1:8080/ -o /tmp/home.html
          grep -q "VERA YAPI" /tmp/home.html
          curl -fsS http://127.0.0.1:8080/admin/login.php -o /tmp/admin-login.html
          grep -q "Tekrar hoş geldiniz." /tmp/admin-login.html
          curl -fsS "http://127.0.0.1:8080/hizmet/konut-projeleri" -o /tmp/service.html
          grep -q "Konut Projeleri" /tmp/service.html
          curl -fsS "http://127.0.0.1:8080/proje/marina-villa" -o /tmp/project.html
          grep -q "Marina Villa" /tmp/project.html
          curl -fsS http://127.0.0.1:8080/blog -o /tmp/blog.html
          grep -q "Bilgi Merkezi" /tmp/blog.html
          curl -fsS http://127.0.0.1:8080/bolge/alanya-merkez -o /tmp/region.html
          grep -q "Alanya Merkez" /tmp/region.html
          curl -fsS http://127.0.0.1:8080/sitemap.xml -o /tmp/sitemap.xml
          grep -q "/hizmet/konut-projeleri" /tmp/sitemap.xml
          curl -fsS http://127.0.0.1:8080/robots.txt -o /tmp/robots.txt
          grep -q "Sitemap:" /tmp/robots.txt
      - name: Show PHP server log on failure
        if: failure()
        run: cat /tmp/netvera-php.log || true
