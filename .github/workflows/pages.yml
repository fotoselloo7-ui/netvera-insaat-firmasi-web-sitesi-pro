name: Deploy static site to GitHub Pages

# Auto-deploy only after the latest PHP/MySQL smoke test completes successfully.
# Rapid commits cancel superseded smoke tests, so Pages does not churn on every push.
on:
  workflow_run:
    workflows:
      - PHP App Smoke Test
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - name: Normalize preview asset versions
        run: |
          find . -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i -E 's#assets/css/corporate\.css\?v=[0-9]+#assets/css/corporate.css?v=24#g; s#assets/js/home\.js\?v=[0-9]+#assets/js/home.js?v=24#g'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
